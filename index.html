<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Board</title>
<style>
  :root{
    --bg:#17191b;
    --panel:#1f2225;
    --ink:#efece5;
    --dim:#8b9096;
    --amber:#e8a33d;
    --red:#d1503f;
    --green:#5c9d75;
    --blue:#4f8fc0;
    --line:#2c2f33;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 40px;
  }
  header{
    padding:20px 16px 14px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:700;
    margin:0 0 4px;
  }
  h1{
    font-size:22px;
    margin:0 0 10px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .meta{
    display:flex;
    gap:14px;
    font-size:12px;
    color:var(--dim);
    flex-wrap:wrap;
  }
  .filters{
    display:flex;
    gap:6px;
    margin-top:14px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .filter-btn{
    flex:none;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--dim);
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-btn.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#1a1305;
  }
  main{
    padding:14px 16px 0;
    max-width:640px;
    margin:0 auto;
  }
  .count-line{
    font-size:12px;
    color:var(--dim);
    margin:14px 2px 10px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--dim);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .card:active{
    background:#262a2d;
  }
  .tap-hint{
    font-size:10.5px;
    color:var(--dim);
    text-align:center;
    margin:6px 0 0;
  }
  .sync-state{
    font-size:11px;
  }
  .sync-state.err{color:var(--red);}
  .sync-state.ok{color:var(--green);}
  .card.p-urgent{border-left-color:var(--red);}
  .card.p-soon{border-left-color:var(--amber);}
  .card.p-routine{border-left-color:var(--blue);}
  .card.status-done{opacity:.5;}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .task-title{
    font-size:15px;
    font-weight:700;
    margin:0 0 3px;
    line-height:1.3;
  }
  .equip{
    font-size:12.5px;
    color:var(--dim);
    margin:0;
  }
  .badge{
    flex:none;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:4px;
    white-space:nowrap;
  }
  .badge.p-urgent{background:rgba(209,80,63,.18);color:var(--red);}
  .badge.p-soon{background:rgba(232,163,61,.18);color:var(--amber);}
  .badge.p-routine{background:rgba(79,143,192,.18);color:var(--blue);}
  .card-notes{
    font-size:13px;
    color:var(--ink);
    margin:8px 0 0;
    line-height:1.4;
  }
  .card-foot{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    color:var(--dim);
    margin-top:8px;
    border-top:1px solid var(--line);
    padding-top:8px;
  }
  .empty{
    text-align:center;
    color:var(--dim);
    font-size:13px;
    padding:40px 20px;
  }
  footer{
    text-align:center;
    font-size:11px;
    color:var(--dim);
    margin-top:24px;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Shop Floor</p>
  <h1>Maintenance Tasks</h1>
  <div class="meta">
    <span id="lastUpdated"></span>
    <span id="openCount"></span>
    <span class="sync-state" id="syncState">Loading…</span>
  </div>
  <div class="filters" id="filters"></div>
</header>

<main>
  <div id="list"></div>
  <p class="tap-hint">Tap a task to cycle: Open → In progress → Done</p>
</main>

<footer>Updated by maintenance team &middot; scan again for latest</footer>

<script>
// ---- PASTE YOUR APPS SCRIPT WEB APP URL HERE ----
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxyJFAM_6MN8NBSR20Fg4nOwQFmuBgMiDJ8G6_DOA9QZ4YNDnIZbZ0Vec-PRwX9BwpR/exec";
// --------------------------------------------------

// Shown if the fetch fails (no signal) so the page still isn't blank.
const FALLBACK_TASKS = [
  { id: "1", title: "Replace hydraulic filter", equipment: "Press #3", priority: "urgent", status: "open", notes: "Pressure warning light on since Monday.", assigned: "Unassigned" }
];

const priorityLabel = { urgent: "Urgent", soon: "Soon", routine: "Routine" };
const statusLabel = { open: "Open", in_progress: "In progress", done: "Done" };
const statusCycle = { open: "in_progress", in_progress: "done", done: "open" };

let TASKS = FALLBACK_TASKS;
let activeFilter = "all";

async function loadTasks() {
  const syncEl = document.getElementById('syncState');
  try {
    const res = await fetch(SHEET_API_URL, { cache: "no-store" });
    const data = await res.json();
    TASKS = data.tasks;
    syncEl.textContent = "Live";
    syncEl.className = "sync-state ok";
    document.getElementById('lastUpdated').textContent = "Updated " + new Date(data.updated).toLocaleString();
  } catch (err) {
    syncEl.textContent = "Offline — showing last known list";
    syncEl.className = "sync-state err";
  }
  renderFilters();
  render();
}

async function updateStatus(id, newStatus) {
  const task = TASKS.find(t => String(t.id) === String(id));
  if (task) task.status = newStatus; // update locally right away
  render();
  try {
    await fetch(SHEET_API_URL, {
      method: "POST",
      mode: "no-cors", // Apps Script web apps don't return readable CORS responses
      body: JSON.stringify({ id, status: newStatus })
    });
  } catch (err) {
    // Will sync next time someone loads the page with a connection.
  }
}

function render() {
  const list = document.getElementById('list');
  const filtered = activeFilter === "all"
    ? TASKS
    : activeFilter === "open"
      ? TASKS.filter(t => t.status !== "done")
      : TASKS.filter(t => t.priority === activeFilter);

  document.getElementById('openCount').textContent =
    TASKS.filter(t => t.status !== "done").length + " open";

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No tasks in this view.</div>';
    return;
  }

  list.innerHTML = filtered.map(t => `
    <div class="card p-${t.priority} status-${t.status}" data-id="${t.id}">
      <div class="card-top">
        <div>
          <p class="task-title">${t.title}</p>
          <p class="equip">${t.equipment}</p>
        </div>
        <span class="badge p-${t.priority}">${priorityLabel[t.priority]}</span>
      </div>
      ${t.notes ? `<p class="card-notes">${t.notes}</p>` : ""}
      <div class="card-foot">
        <span>${statusLabel[t.status]}</span>
        <span>${t.assigned}</span>
      </div>
    </div>
  `).join("");

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      const task = TASKS.find(t => String(t.id) === String(id));
      if (task) updateStatus(id, statusCycle[task.status]);
    });
  });
}

function renderFilters() {
  const opts = [
    { id: "all", label: "All" },
    { id: "open", label: "Not done" },
    { id: "urgent", label: "Urgent" },
    { id: "soon", label: "Soon" },
    { id: "routine", label: "Routine" }
  ];
  document.getElementById('filters').innerHTML = opts.map(o =>
    `<button class="filter-btn${activeFilter===o.id?' active':''}" data-f="${o.id}">${o.label}</button>`
  ).join("");
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.f;
      renderFilters();
      render();
    });
  });
}

loadTasks();
</script>

</body>
</html>
