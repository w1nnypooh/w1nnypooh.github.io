<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Board</title>
<style>
  :root{
    --bg:#15181c;
    --panel:#1e2227;
    --ink:#eef1f5;
    --dim:#8b939c;
    --accent:#0f52ba;
    --accent-ink:#eaf1ff;
    --amber:#e8a33d;
    --red:#d1503f;
    --green:#5c9d75;
    --blue:#4f8fc0;
    --line:#2a2f36;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 40px;
  }
  header{
    padding:20px 16px 14px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin:0 0 4px;
  }
  h1{
    font-size:22px;
    margin:0 0 10px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .meta{
    display:flex;
    gap:14px;
    font-size:12px;
    color:var(--dim);
    flex-wrap:wrap;
  }
  .filters{
    display:flex;
    gap:6px;
    margin-top:14px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .filter-btn{
    flex:none;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--dim);
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  main{
    padding:14px 16px 0;
    max-width:640px;
    margin:0 auto;
  }
  .sync-state{
    font-size:11px;
  }
  .sync-state.err{color:var(--red);}
  .sync-state.ok{color:var(--green);}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--dim);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:10px;
    transition:border-color .25s ease;
  }
  .card.p-urgent{border-left-color:var(--red);}
  .card.p-soon{border-left-color:var(--amber);}
  .card.p-routine{border-left-color:var(--blue);}
  .card.status-done{opacity:.55;}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .task-title{
    font-size:15px;
    font-weight:700;
    margin:0 0 3px;
    line-height:1.3;
  }
  .equip{
    font-size:12.5px;
    color:var(--dim);
    margin:0;
  }
  .badge{
    flex:none;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:4px;
    white-space:nowrap;
  }
  .badge.p-urgent{background:rgba(209,80,63,.18);color:var(--red);}
  .badge.p-soon{background:rgba(232,163,61,.18);color:var(--amber);}
  .badge.p-routine{background:rgba(79,143,192,.18);color:var(--blue);}
  .badge.recurrence{
    background:rgba(92,157,117,.18);
    color:var(--green);
    margin-left:6px;
  }
  .card-notes{
    font-size:13px;
    color:var(--ink);
    margin:8px 0 0;
    line-height:1.4;
  }
  .card-foot-sub{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--dim);
    margin-top:10px;
  }
  .request-meta{
    font-size:12px;
    color:var(--dim);
    margin:8px 0 0;
    line-height:1.4;
  }
  .request-meta strong{
    color:var(--ink);
    font-weight:600;
  }
  .section-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin:20px 2px 10px;
  }
  .section-header:first-child{
    margin-top:4px;
  }
  .section-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    flex:none;
  }
  .section-dot.p-urgent{background:var(--red);}
  .section-dot.p-soon{background:var(--amber);}
  .section-dot.p-routine{background:var(--blue);}
  .section-title{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .section-count{
    font-size:11.5px;
    color:var(--dim);
  }

  /* --- status control: explicit buttons, not a whole-card tap --- */
  .status-control{
    display:flex;
    gap:6px;
    margin-top:10px;
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .status-btn{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    font-size:11.5px;
    font-weight:700;
    padding:8px 6px;
    border-radius:6px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease, background .18s ease, border-color .18s ease, color .18s ease;
  }
  .status-btn:active{
    transform:scale(.94);
  }
  .status-btn.current{
    color:#fff;
  }
  .status-btn.current[data-status="open"]{ background:var(--red); border-color:var(--red); }
  .status-btn.current[data-status="in_progress"]{ background:var(--amber); border-color:var(--amber); color:#241a05; }
  .status-btn.current[data-status="done"]{ background:var(--green); border-color:var(--green); }
  .status-btn.just-set{
    animation:pop .32s ease;
  }
  @keyframes pop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }

  .empty{
    text-align:center;
    color:var(--dim);
    font-size:13px;
    padding:40px 20px;
  }
  footer{
    text-align:center;
    font-size:11px;
    color:var(--dim);
    margin-top:24px;
  }

  /* --- announcement banner --- */
  .announcement{
    background:rgba(15,82,186,.12);
    border:1px solid rgba(15,82,186,.35);
    border-radius:8px;
    padding:12px 14px;
    margin:14px 0;
  }
  .announcement-label{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 5px;
  }
  .announcement-text{
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink);
    margin:0;
    white-space:pre-wrap;
  }
  .announcement-edit-btn{
    background:none;
    border:none;
    color:var(--dim);
    font-size:11px;
    text-decoration:underline;
    cursor:pointer;
    padding:8px 0 0;
  }

  /* --- supplies section --- */
  .supplies-section{
    margin:20px 0;
    padding-top:6px;
  }
  .supplies-title{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0 0 10px;
  }
  .preset-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
  }
  .preset-btn{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-size:12.5px;
    font-weight:600;
    padding:12px 8px;
    border-radius:6px;
    cursor:pointer;
    text-align:center;
    transition:transform .12s ease, border-color .18s ease;
  }
  .preset-btn:active{ transform:scale(.96); }
  .preset-btn.just-sent{
    border-color:var(--green);
    color:var(--green);
  }
  .custom-request-row{
    display:flex;
    gap:8px;
  }
  .custom-input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-size:13px;
    padding:10px 12px;
    border-radius:6px;
  }
  .custom-input::placeholder{ color:var(--dim); }
  .custom-submit{
    background:var(--accent);
    border:none;
    color:var(--accent-ink);
    font-size:12.5px;
    font-weight:700;
    padding:0 16px;
    border-radius:6px;
    cursor:pointer;
  }
  .supply-list{
    margin-top:12px;
  }
  .supply-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    padding:8px 0;
    border-top:1px solid var(--line);
    gap:8px;
  }
  .supply-item-name{ color:var(--ink); }
  .supply-status{
    font-size:11px;
    color:var(--amber);
    white-space:nowrap;
  }
  .supply-status.ordered{ color:var(--green); }
  .supply-mark-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--dim);
    font-size:10.5px;
    padding:4px 8px;
    border-radius:4px;
    cursor:pointer;
    white-space:nowrap;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Shop Floor</p>
  <h1>Maintenance Tasks</h1>
  <div class="meta">
    <span id="lastUpdated"></span>
    <span id="openCount"></span>
    <span class="sync-state" id="syncState">Loading…</span>
  </div>
  <div class="filters" id="filters"></div>
</header>

<main>
  <div id="announcementBox"></div>
  <div id="suppliesBox"></div>
  <div id="list"></div>
</main>

<footer>Updated by maintenance team &middot; scan again for latest</footer>

<script>
// ---- PASTE YOUR APPS SCRIPT WEB APP URL HERE ----
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxyJFAM_6MN8NBSR20Fg4nOwQFmuBgMiDJ8G6_DOA9QZ4YNDnIZbZ0Vec-PRwX9BwpR/exec";
// --------------------------------------------------

// Must match ADMIN_PIN in your Apps Script exactly. Change both together.
const ADMIN_PIN = "1234";

const PRESET_SUPPLIES = ["Zip ties", "Electrical tape", "Box cutters", "Cut-off wheels"];

// Shown if the fetch fails (no signal) so the page still isn't blank.
const FALLBACK_TASKS = [
  { id: "1", title: "Replace hydraulic filter", equipment: "Press #3", priority: "urgent", status: "open", notes: "Pressure warning light on since Monday.", assigned: "Unassigned", requested_by: "", date_added: "", scheduled: "no", recurrence: "" }
];

const priorityLabel = { urgent: "Urgent", soon: "Soon", routine: "Routine" };
const statusLabel = { open: "Open", in_progress: "In progress", done: "Done" };
const priorityRank = { urgent: 0, soon: 1, routine: 2 };

let TASKS = FALLBACK_TASKS;
let ANNOUNCEMENT = "";
let SUPPLIES = [];
let activeFilter = "all";

function formatDateLong(dateStr) {
  if (!dateStr) return "—";
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr; // show as-typed if it doesn't parse
  return d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
}

function relativeTime(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return "";
  const diffMs = Date.now() - d.getTime();
  const diffHrs = diffMs / (1000 * 60 * 60);
  if (diffHrs < 1) return "just now";
  if (diffHrs < 24) return Math.floor(diffHrs) + (Math.floor(diffHrs) === 1 ? " hour ago" : " hours ago");
  const diffDays = Math.floor(diffHrs / 24);
  if (diffDays < 14) return diffDays + (diffDays === 1 ? " day ago" : " days ago");
  const diffWeeks = Math.floor(diffDays / 7);
  return diffWeeks + (diffWeeks === 1 ? " week ago" : " weeks ago");
}

async function loadTasks() {
  const syncEl = document.getElementById('syncState');
  try {
    const res = await fetch(SHEET_API_URL, { cache: "no-store" });
    const data = await res.json();
    TASKS = data.tasks;
    ANNOUNCEMENT = data.announcement || "";
    SUPPLIES = data.supplies || [];
    syncEl.textContent = "Live";
    syncEl.className = "sync-state ok";
    document.getElementById('lastUpdated').textContent = "Updated " + new Date(data.updated).toLocaleString();
  } catch (err) {
    syncEl.textContent = "Offline — showing last known list";
    syncEl.className = "sync-state err";
  }
  renderFilters();
  render();
  renderAnnouncement();
  renderSupplies();
}

function renderAnnouncement() {
  const box = document.getElementById('announcementBox');
  box.innerHTML = `
    <div class="announcement">
      <p class="announcement-label">Shop Notes</p>
      <p class="announcement-text">${ANNOUNCEMENT ? escapeHtml(ANNOUNCEMENT) : "No notes posted right now."}</p>
      <button class="announcement-edit-btn" id="editAnnouncementBtn">Edit (supervisor)</button>
    </div>
  `;
  document.getElementById('editAnnouncementBtn').addEventListener('click', async () => {
    const pin = prompt("Enter supervisor PIN:");
    if (pin === null) return;
    if (pin !== ADMIN_PIN) { alert("Wrong PIN."); return; }
    const newText = prompt("Update shop notes:", ANNOUNCEMENT);
    if (newText === null) return;
    ANNOUNCEMENT = newText;
    renderAnnouncement();
    try {
      await fetch(SHEET_API_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ action: "update_announcement", pin, text: newText })
      });
    } catch (err) {}
  });
}

function renderSupplies() {
  const box = document.getElementById('suppliesBox');
  const pending = SUPPLIES.filter(s => s.status !== "ordered");
  const ordered = SUPPLIES.filter(s => s.status === "ordered").slice(-5).reverse();

  box.innerHTML = `
    <div class="supplies-section">
      <p class="supplies-title">Need Supplies?</p>
      <div class="preset-grid" id="presetGrid">
        ${PRESET_SUPPLIES.map(item => `<button class="preset-btn" data-item="${item}">${item}</button>`).join("")}
      </div>
      <div class="custom-request-row">
        <input class="custom-input" id="customSupplyInput" type="text" placeholder="Something else? Type it here…">
        <button class="custom-submit" id="customSupplySubmit">Send</button>
      </div>
      <div class="supply-list">
        ${pending.map(s => `
          <div class="supply-row">
            <span class="supply-item-name">${escapeHtml(s.item)}${s.detail ? " — " + escapeHtml(s.detail) : ""}</span>
            <span class="supply-status">Requested</span>
            <button class="supply-mark-btn" data-id="${s.id}">Mark ordered</button>
          </div>
        `).join("")}
        ${ordered.map(s => `
          <div class="supply-row">
            <span class="supply-item-name">${escapeHtml(s.item)}</span>
            <span class="supply-status ordered">Ordered ${formatDateLong(s.ordered_at)}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.classList.add('just-sent');
      btn.textContent = "Sent ✓";
      try {
        await fetch(SHEET_API_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify({ action: "request_supply", item: btn.dataset.item, type: "preset" })
        });
      } catch (err) {}
    });
  });

  document.getElementById('customSupplySubmit').addEventListener('click', async () => {
    const input = document.getElementById('customSupplyInput');
    const val = input.value.trim();
    if (!val) return;
    input.value = "";
    try {
      await fetch(SHEET_API_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ action: "request_supply", item: val, type: "custom" })
      });
    } catch (err) {}
  });

  document.querySelectorAll('.supply-mark-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const pin = prompt("Enter supervisor PIN:");
      if (pin === null) return;
      if (pin !== ADMIN_PIN) { alert("Wrong PIN."); return; }
      try {
        await fetch(SHEET_API_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify({ action: "mark_ordered", pin, id: btn.dataset.id })
        });
      } catch (err) {}
      loadTasks();
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function setStatus(id, newStatus, btnEl) {
  const task = TASKS.find(t => String(t.id) === String(id));
  if (task) task.status = newStatus; // update locally right away
  render();
  // Re-find the equivalent button after re-render and give it a satisfying pop.
  requestAnimationFrame(() => {
    const card = document.querySelector(`.card[data-id="${CSS.escape(String(id))}"]`);
    const freshBtn = card && card.querySelector(`.status-btn[data-status="${newStatus}"]`);
    if (freshBtn) {
      freshBtn.classList.add('just-set');
      setTimeout(() => freshBtn.classList.remove('just-set'), 320);
    }
  });
  try {
    await fetch(SHEET_API_URL, {
      method: "POST",
      mode: "no-cors", // Apps Script web apps don't return readable CORS responses
      body: JSON.stringify({ id, status: newStatus })
    });
  } catch (err) {
    // Will sync next time someone loads the page with a connection.
  }
}

function sortByUrgency(tasks) {
  return [...tasks].sort((a, b) => {
    const aDone = a.status === "done" ? 1 : 0;
    const bDone = b.status === "done" ? 1 : 0;
    if (aDone !== bDone) return aDone - bDone; // open/in-progress before done
    const ar = priorityRank[a.priority] ?? 3;
    const br = priorityRank[b.priority] ?? 3;
    return ar - br;
  });
}

function cardHtml(t) {
  return `
    <div class="card p-${t.priority} status-${t.status}" data-id="${t.id}">
      <div class="card-top">
        <div>
          <p class="task-title">${t.title}${t.recurrence ? `<span class="badge recurrence">${t.recurrence}</span>` : ""}</p>
          <p class="equip">${t.equipment}</p>
        </div>
        <span class="badge p-${t.priority}">${priorityLabel[t.priority]}</span>
      </div>
      ${t.notes ? `<p class="card-notes">${t.notes}</p>` : ""}
      <p class="request-meta">Requested by <strong>${t.requested_by || "—"}</strong> · ${formatDateLong(t.date_added)}${t.date_added ? " (" + relativeTime(t.date_added) + ")" : ""}</p>
      <div class="status-control">
        ${["open", "in_progress", "done"].map(s => `
          <button class="status-btn${t.status === s ? ' current' : ''}" data-status="${s}" data-id="${t.id}">
            ${statusLabel[s]}
          </button>
        `).join("")}
      </div>
      <div class="card-foot-sub">
        <span>Assigned: ${t.assigned ? t.assigned : "Unassigned"}</span>
      </div>
    </div>
  `;
}

function render() {
  const list = document.getElementById('list');
  const base = activeFilter === "all"
    ? TASKS
    : activeFilter === "open"
      ? TASKS.filter(t => t.status !== "done")
      : activeFilter === "scheduled"
        ? TASKS.filter(t => String(t.scheduled).toLowerCase() === "yes")
        : TASKS.filter(t => t.priority === activeFilter);

  document.getElementById('openCount').textContent =
    TASKS.filter(t => t.status !== "done").length + " open";

  if (base.length === 0) {
    list.innerHTML = '<div class="empty">No tasks in this view.</div>';
    return;
  }

  if (activeFilter === "all") {
    // Grouped by urgency with section headers.
    const groups = ["urgent", "soon", "routine"].map(p => ({
      key: p,
      tasks: sortByUrgency(base.filter(t => t.priority === p))
    })).filter(g => g.tasks.length > 0);

    list.innerHTML = groups.map(g => `
      <div class="section-header">
        <span class="section-dot p-${g.key}"></span>
        <span class="section-title">${priorityLabel[g.key]}</span>
        <span class="section-count">${g.tasks.length}</span>
      </div>
      ${g.tasks.map(cardHtml).join("")}
    `).join("");
  } else {
    // Flat, sorted list for a single filter.
    list.innerHTML = sortByUrgency(base).map(cardHtml).join("");
  }

  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setStatus(btn.dataset.id, btn.dataset.status, btn);
    });
  });
}

function renderFilters() {
  const opts = [
    { id: "all", label: "All" },
    { id: "open", label: "Not done" },
    { id: "scheduled", label: "Scheduled" },
    { id: "urgent", label: "Urgent" },
    { id: "soon", label: "Soon" },
    { id: "routine", label: "Routine" }
  ];
  document.getElementById('filters').innerHTML = opts.map(o =>
    `<button class="filter-btn${activeFilter===o.id?' active':''}" data-f="${o.id}">${o.label}</button>`
  ).join("");
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.f;
      renderFilters();
      render();
    });
  });
}

loadTasks();
</script>

</body>
</html>
