<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Board</title>
<style>
  :root{
    --bg:#15181c;
    --panel:#1e2227;
    --ink:#eef1f5;
    --dim:#8b939c;
    --accent:#0f52ba;
    --accent-ink:#eaf1ff;
    --amber:#e8a33d;
    --red:#d1503f;
    --green:#5c9d75;
    --blue:#4f8fc0;
    --line:#2a2f36;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 40px;
  }
  header{
    padding:20px 16px 14px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin:0 0 4px;
  }
  h1{
    font-size:22px;
    margin:0 0 10px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .meta{
    display:flex;
    gap:14px;
    font-size:12px;
    color:var(--dim);
    flex-wrap:wrap;
  }
  .filters{
    display:flex;
    gap:6px;
    margin-top:14px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .filter-btn{
    flex:none;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--dim);
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  main{
    padding:14px 16px 0;
    max-width:640px;
    margin:0 auto;
  }
  .sync-state{
    font-size:11px;
  }
  .sync-state.err{color:var(--red);}
  .sync-state.ok{color:var(--green);}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--dim);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:10px;
    transition:border-color .25s ease;
  }
  .card.p-urgent{border-left-color:var(--red);}
  .card.p-soon{border-left-color:var(--amber);}
  .card.p-routine{border-left-color:var(--blue);}
  .card.status-done{opacity:.55;}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .task-title{
    font-size:15px;
    font-weight:700;
    margin:0 0 3px;
    line-height:1.3;
  }
  .equip{
    font-size:12.5px;
    color:var(--dim);
    margin:0;
  }
  .badge{
    flex:none;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:4px;
    white-space:nowrap;
  }
  .badge.p-urgent{background:rgba(209,80,63,.18);color:var(--red);}
  .badge.p-soon{background:rgba(232,163,61,.18);color:var(--amber);}
  .badge.p-routine{background:rgba(79,143,192,.18);color:var(--blue);}
  .badge.recurrence{
    background:rgba(92,157,117,.18);
    color:var(--green);
    margin-left:6px;
  }
  .card-notes{
    font-size:13px;
    color:var(--ink);
    margin:8px 0 0;
    line-height:1.4;
  }
  .card-foot-sub{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--dim);
    margin-top:10px;
  }

  /* --- status control: explicit buttons, not a whole-card tap --- */
  .status-control{
    display:flex;
    gap:6px;
    margin-top:10px;
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .status-btn{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    font-size:11.5px;
    font-weight:700;
    padding:8px 6px;
    border-radius:6px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease, background .18s ease, border-color .18s ease, color .18s ease;
  }
  .status-btn:active{
    transform:scale(.94);
  }
  .status-btn.current{
    color:#fff;
  }
  .status-btn.current[data-status="open"]{ background:var(--red); border-color:var(--red); }
  .status-btn.current[data-status="in_progress"]{ background:var(--amber); border-color:var(--amber); color:#241a05; }
  .status-btn.current[data-status="done"]{ background:var(--green); border-color:var(--green); }
  .status-btn.just-set{
    animation:pop .32s ease;
  }
  @keyframes pop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }

  .empty{
    text-align:center;
    color:var(--dim);
    font-size:13px;
    padding:40px 20px;
  }
  footer{
    text-align:center;
    font-size:11px;
    color:var(--dim);
    margin-top:24px;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Shop Floor</p>
  <h1>Maintenance Tasks</h1>
  <div class="meta">
    <span id="lastUpdated"></span>
    <span id="openCount"></span>
    <span class="sync-state" id="syncState">Loading…</span>
  </div>
  <div class="filters" id="filters"></div>
</header>

<main>
  <div id="list"></div>
</main>

<footer>Updated by maintenance team &middot; scan again for latest</footer>

<script>
// ---- PASTE YOUR APPS SCRIPT WEB APP URL HERE ----
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxyJFAM_6MN8NBSR20Fg4nOwQFmuBgMiDJ8G6_DOA9QZ4YNDnIZbZ0Vec-PRwX9BwpR/exec";
// --------------------------------------------------

// Shown if the fetch fails (no signal) so the page still isn't blank.
const FALLBACK_TASKS = [
  { id: "1", title: "Replace hydraulic filter", equipment: "Press #3", priority: "urgent", status: "open", notes: "Pressure warning light on since Monday.", assigned: "Unassigned", requested_by: "", date_added: "", scheduled: "no", recurrence: "" }
];

const priorityLabel = { urgent: "Urgent", soon: "Soon", routine: "Routine" };
const statusLabel = { open: "Open", in_progress: "In progress", done: "Done" };
const priorityRank = { urgent: 0, soon: 1, routine: 2 };

let TASKS = FALLBACK_TASKS;
let activeFilter = "all";

async function loadTasks() {
  const syncEl = document.getElementById('syncState');
  try {
    const res = await fetch(SHEET_API_URL, { cache: "no-store" });
    const data = await res.json();
    TASKS = data.tasks;
    syncEl.textContent = "Live";
    syncEl.className = "sync-state ok";
    document.getElementById('lastUpdated').textContent = "Updated " + new Date(data.updated).toLocaleString();
  } catch (err) {
    syncEl.textContent = "Offline — showing last known list";
    syncEl.className = "sync-state err";
  }
  renderFilters();
  render();
}

async function setStatus(id, newStatus, btnEl) {
  const task = TASKS.find(t => String(t.id) === String(id));
  if (task) task.status = newStatus; // update locally right away
  render();
  // Re-find the equivalent button after re-render and give it a satisfying pop.
  requestAnimationFrame(() => {
    const card = document.querySelector(`.card[data-id="${CSS.escape(String(id))}"]`);
    const freshBtn = card && card.querySelector(`.status-btn[data-status="${newStatus}"]`);
    if (freshBtn) {
      freshBtn.classList.add('just-set');
      setTimeout(() => freshBtn.classList.remove('just-set'), 320);
    }
  });
  try {
    await fetch(SHEET_API_URL, {
      method: "POST",
      mode: "no-cors", // Apps Script web apps don't return readable CORS responses
      body: JSON.stringify({ id, status: newStatus })
    });
  } catch (err) {
    // Will sync next time someone loads the page with a connection.
  }
}

function sortByUrgency(tasks) {
  return [...tasks].sort((a, b) => {
    const aDone = a.status === "done" ? 1 : 0;
    const bDone = b.status === "done" ? 1 : 0;
    if (aDone !== bDone) return aDone - bDone; // open/in-progress before done
    const ar = priorityRank[a.priority] ?? 3;
    const br = priorityRank[b.priority] ?? 3;
    return ar - br;
  });
}

function render() {
  const list = document.getElementById('list');
  const base = activeFilter === "all"
    ? TASKS
    : activeFilter === "open"
      ? TASKS.filter(t => t.status !== "done")
      : activeFilter === "scheduled"
        ? TASKS.filter(t => String(t.scheduled).toLowerCase() === "yes")
        : TASKS.filter(t => t.priority === activeFilter);

  const filtered = sortByUrgency(base);

  document.getElementById('openCount').textContent =
    TASKS.filter(t => t.status !== "done").length + " open";

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No tasks in this view.</div>';
    return;
  }

  list.innerHTML = filtered.map(t => `
    <div class="card p-${t.priority} status-${t.status}" data-id="${t.id}">
      <div class="card-top">
        <div>
          <p class="task-title">${t.title}${t.recurrence ? `<span class="badge recurrence">${t.recurrence}</span>` : ""}</p>
          <p class="equip">${t.equipment}</p>
        </div>
        <span class="badge p-${t.priority}">${priorityLabel[t.priority]}</span>
      </div>
      ${t.notes ? `<p class="card-notes">${t.notes}</p>` : ""}
      <div class="status-control">
        ${["open", "in_progress", "done"].map(s => `
          <button class="status-btn${t.status === s ? ' current' : ''}" data-status="${s}" data-id="${t.id}">
            ${statusLabel[s]}
          </button>
        `).join("")}
      </div>
      <div class="card-foot-sub">
        <span>${t.assigned ? t.assigned : "Unassigned"}${t.date_added ? " · Added " + t.date_added : ""}</span>
        <span>${t.requested_by ? "Req: " + t.requested_by : ""}</span>
      </div>
    </div>
  `).join("");

  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setStatus(btn.dataset.id, btn.dataset.status, btn);
    });
  });
}

function renderFilters() {
  const opts = [
    { id: "all", label: "All" },
    { id: "open", label: "Not done" },
    { id: "scheduled", label: "Scheduled" },
    { id: "urgent", label: "Urgent" },
    { id: "soon", label: "Soon" },
    { id: "routine", label: "Routine" }
  ];
  document.getElementById('filters').innerHTML = opts.map(o =>
    `<button class="filter-btn${activeFilter===o.id?' active':''}" data-f="${o.id}">${o.label}</button>`
  ).join("");
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.f;
      renderFilters();
      render();
    });
  });
}

loadTasks();
</script>

</body>
</html>
